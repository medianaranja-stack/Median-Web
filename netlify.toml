# Este archivo va en la RAIZ del repo: cuando el deploy se dispara desde GitHub,
# Netlify lee netlify.toml desde acá. Si quedara dentro de MediaNaranjaWeb/app/
# lo ignoraria por completo — no sabria compilar, /limpieza y /admin darian 404
# y se perderian todas las cabeceras de seguridad.

[build]
  # La app no esta en la raiz. `publish` y `command` son relativos a `base`.
  base = "MediaNaranjaWeb/app"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Vite reemplaza las VITE_* por su valor literal dentro del JS compilado. El
  # escaneo de secretos de Netlify las encuentra ahí y aborta el build. No es un
  # secreto filtrado: la anon key es pública por diseño y la seguridad está en
  # las policies RLS de Supabase. Sin esto, conectar el repo a Netlify falla.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

# La linea Hogar se dio de baja: 301 a la home para no dejar URLs indexadas
# devolviendo la landing con la URL vieja.
[[redirects]]
  from = "/hogar"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/hogar/*"
  to = "/"
  status = 301
  force = true

# Ya no hay Edge Function. Las paginas publicas se dibujan al construir
# (scripts/prerender.mjs), asi que el HTML sale del CDN ya escrito: mas rapido
# que renderizar en cada visita y sin gastar invocaciones del plan.

# Las imagenes de Supabase se sirven por nuestro dominio en vez de directo.
# Motivo: en el plan gratuito Supabase responde con `sb-gateway-mode: direct` y
# fuerza `cache-control: no-cache` ignorando el que se manda al subir, asi que
# cada visita volvia a descargar todo. Pasandolas por aca controlamos el cache
# nosotros (ver la regla de headers mas abajo) y ademas salen por el CDN de
# Netlify, mas cerca del visitante.
[[redirects]]
  from = "/img/*"
  to = "https://dqlixhlsbyofejjqexzl.supabase.co/storage/v1/object/public/:splat"
  status = 200
  force = true

# /admin es privado: no se prerenderiza, asi que va al molde vacio. Si cayera
# en /index.html recibiria el home ya dibujado y React tendria que borrarlo y
# rehacerlo, que es un parpadeo gratis.
[[redirects]]
  from = "/admin/*"
  to = "/app.html"
  status = 200

# Resto de rutas al home. Netlify sirve los archivos estaticos ANTES que las
# redirecciones, asi que /limpieza y sus categorias reciben su propio HTML ya
# dibujado y no pasan por aca. Lo que llegue es una ruta desconocida, y para
# esas la app muestra el home igual (<Route path="*" element={<Landing />} />),
# asi que el marcado que reciben es el correcto.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------- Cabeceras de seguridad ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-site"
    X-DNS-Prefetch-Control = "off"
    # CSP acotada al proyecto Supabase del cliente (sin comodín *.supabase.co:
    # si algún script se colara, no podría exfiltrar a otro proyecto Supabase).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://dqlixhlsbyofejjqexzl.supabase.co https://www.medianaranja.com.ar; connect-src 'self' https://dqlixhlsbyofejjqexzl.supabase.co wss://dqlixhlsbyofejjqexzl.supabase.co; object-src 'none'; frame-src 'none'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

# Cache largo para assets con hash
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El nombre del archivo lleva un hash del contenido: si cambia la imagen cambia
# la URL, asi que se puede cachear para siempre sin miedo a servir una vieja.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El HTML se regenera en cada despliegue: hay que revalidarlo siempre, o el CDN
# seguiria sirviendo la version vieja despues de publicar cambios.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/fabrica/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
